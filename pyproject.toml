[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-typesafe"
version = "0.1.0"
description = "Advisory TypeSafe semantic evidence plugin for Agent-Workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ngallodev-software"}]
classifiers = ["Programming Language :: Python :: 3 :: Only"]

[project.optional-dependencies]
typesafe = ["typesafe-sdk==0.6.0"]
test = ["pytest>=8"]

[project.entry-points."agent_workflow.plugins"]
agent-workflow-typesafe = "agent_workflow_typesafe.plugin:plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_workflow_typesafe = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

